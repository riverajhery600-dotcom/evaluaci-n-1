<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño Responsive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#">HEADER.Logo.Navegacion.Menu</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
  </header>

  <main>
    <section class="hero" id="inicio">
      <h1>HERO SECTION</h1>
      <p>Título principal y descripción del proyecto</p>
      <a class="btn" href="#cards">BOTÓN CTA</a>
    </section>

    <section class="cards" id="cards">
      <article class="card"><h2>CARD 1</h2><p></p></article>
      <article class="card"><h2>CARD 2</h2><p></p></article>
      <article class="card"><h2>CARD 3</h2><p></p></article>
    </section>

    <section class="about" id="about">
      <h2>ABOUT / INFORMACIÓN</h2>
      <div class="about-IMAGEN">
      <img src="img/ramon.jpg" alt="ramon siendo ramon">
      </div>
      <p>Descripción e información del proyecto.</p>
    </section>

    <section class="cta" id="contacto">
      <h2>CALL TO ACTION</h2>
    </section>
  </main>

  <footer class="footer">
    <h2>FOOTER</h2>
    <p>Enlaces · Redes · Contacto</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
